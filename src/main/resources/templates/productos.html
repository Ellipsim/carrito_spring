<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar bg-white border-bottom py-3">
	    <div class="container">
	        <a class="navbar-brand fw-bold" th:href="@{/}">
	            Mi Tienda
	        </a>

			<!-- Show when logged in -->
			<div xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
			     sec:authorize="isAuthenticated()"
			     class="d-flex align-items-center gap-3">

			    <span sec:authentication="name"></span>

			    <form th:action="@{/logout}" method="post" class="m-0">
			        <input type="hidden"
			               th:name="${_csrf.parameterName}"
			               th:value="${_csrf.token}">

			        <button type="submit" class="btn btn-outline-danger btn-sm">
			            Cerrar sesión
			        </button>
			    </form>
			</div>

			<!-- Show when not logged in -->
			<a xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
			   sec:authorize="isAnonymous()"
			   th:href="@{/login}"
			   class="btn btn-primary btn-sm">
			    Iniciar sesión
			</a>
	    </div>
	</nav>
    <div class="container">
        <h1 class="text-center my-5">Catálogo de Productos</h1>
		<!-- Search and price filters -->
		<form th:action="@{/products}" method="get" class="row g-3 mb-4">

		    <div class="col-md-4">
		        <input type="text"
		               name="name"
		               class="form-control"
		               placeholder="Buscar producto por nombre"
		               th:value="${name}">
		    </div>

			<div class="col-md-3">
			    <input type="number"
			           name="minPrice"
			           class="form-control"
			           placeholder="Precio mínimo (€)"
			           min="0"
			           step="0.01"
			           th:value="${minPrice != null ? #numbers.formatDecimal(minPrice, 1, 2, 'POINT') : ''}">
			</div>

			<div class="col-md-3">
			    <input type="number"
			           name="maxPrice"
			           class="form-control"
			           placeholder="Precio máximo (€)"
			           min="0"
			           step="0.01"
			           th:value="${maxPrice != null ? #numbers.formatDecimal(maxPrice, 1, 2, 'POINT') : ''}">
			</div>

		    <div class="col-md-2 d-flex gap-2">
		        <button type="submit" class="btn btn-primary">
		            Buscar
		        </button>

		        <a th:href="@{/products}" class="btn btn-outline-secondary">
		            Limpiar
		        </a>
		    </div>

		</form>
        <div class="mb-4">
            <a href="/cart" class="btn btn-secondary">Ver Carrito</a>
        </div>
        <div class="row">
            <div th:each="product : ${productList}" class="col-md-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${product.name}">Nombre del Producto</h5>
                        <p class="card-text" th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' €'">Precio</p>
                        <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-primary">Agregar al Carrito</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
