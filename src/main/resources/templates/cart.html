<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Carrito de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar bg-white border-bottom py-3">
	    <div class="container">
			<a class="navbar-brand" href="/">
			    <img src="https://img.icons8.com/ios-filled/50/000000/home.png" alt="Inicio" width="30" height="30">
			</a>

			<!-- Show when logged in -->
			<div xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
			     sec:authorize="isAuthenticated()"
			     class="d-flex align-items-center gap-3">

			    <span sec:authentication="name"></span>

			    <form th:action="@{/logout}" method="post" class="m-0">
			        <input type="hidden"
			               th:name="${_csrf.parameterName}"
			               th:value="${_csrf.token}">

			        <button type="submit" class="btn btn-outline-danger btn-sm">
			            Cerrar sesión
			        </button>
			    </form>
			</div>

			<!-- Show when not logged in -->
			<a xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
			   sec:authorize="isAnonymous()"
			   th:href="@{/login}"
			   class="btn btn-primary btn-sm">
			    Iniciar sesión
			</a>
	    </div>
	</nav>
    <div class="container">
        <h1 class="text-center my-5">Carrito de Compras</h1>
        <div class="mb-4">
            <a href="/products" class="btn btn-secondary">Continuar Comprando</a>
        </div>
        <div>
			<ul class="list-group">
			    <li th:each="item : ${cart}"
			        class="list-group-item d-flex justify-content-between align-items-center">

			        <div>
			            <span th:text="${item.product.name}">Nombre del Producto</span>
			            <br>
			            <small class="text-muted">
			                Precio unitario:
			                <span th:text="${#numbers.formatDecimal(item.product.price, 1, 2)} + ' €'">
			                    0,00 €
			                </span>
			            </small>
			            <br>
			            <span class="badge bg-primary rounded-pill">
			                Cantidad:
			                <span th:text="${item.quantity}">1</span>
			            </span>
			            <br>
			            <strong>
			                Subtotal:
			                <span th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 1, 2)} + ' €'">
			                    0,00 €
			                </span>
			            </strong>
			        </div>

			        <form th:action="@{/cart/remove/{id}(id=${item.product.id})}"
			              method="post">
			            <input type="hidden"
			                   th:name="${_csrf.parameterName}"
			                   th:value="${_csrf.token}">
			            <button type="submit" class="btn btn-danger">
			                Eliminar
			            </button>
			        </form>
			    </li>
			</ul>
			<div class="text-end mt-4 p-3 border rounded">
			    <h4>
			        Total:
			        <span th:text="${#numbers.formatDecimal(total, 1, 2)} + ' €'">
			            0,00 €
			        </span>
			    </h4>
			</div>
        </div>
    </div>
</body>
</html>
