<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<div class="container">

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-light mb-4">
        <a class="navbar-brand" href="/">
            <img src="https://img.icons8.com/ios-filled/50/000000/home.png"
                 alt="Inicio"
                 width="30"
                 height="30">
        </a>

        <a href="/admin" class="btn btn-secondary">
            Volver a Administración
        </a>
    </nav>

	<h1 class="text-center mb-5"
	    th:text="${editMode ? 'Editar Producto' : 'Añadir Nuevo Producto'}">
	    Añadir Producto
	</h1>

    <div class="row">
        <div class="col-md-6 mx-auto">

            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Datos del Producto</h5>
                </div>

                <div class="card-body">

                    <form th:action="@{/products/save}"
					      th:object="${product}"
					      method="post">
					
					    <!-- ID del producto: importante para editar -->
					    <input type="hidden" th:field="*{id}">
					
					    <!-- CSRF token -->
					    <input type="hidden"
					           th:name="${_csrf.parameterName}"
					           th:value="${_csrf.token}">
					
					    <div class="mb-3">
					        <label for="name" class="form-label">
					            Nombre del Producto
					        </label>
					
					        <input type="text"
					               id="name"
					               th:field="*{name}"
					               class="form-control"
					               required>
					    </div>
					
					    <div class="mb-3">
					        <label for="price" class="form-label">
					            Precio
					        </label>
					
					        <input type="number"
					               id="price"
					               th:field="*{price}"
					               step="0.01"
					               min="0"
					               class="form-control"
					               required>
					    </div>
					
					    <div class="d-flex justify-content-between">
					
					        <a href="/admin"
					           class="btn btn-secondary">
					            Cancelar
					        </a>
					
					        <button type="submit"
					                class="btn btn-primary"
					                th:text="${editMode ? 'Guardar Cambios' : 'Agregar Producto'}">
					            Agregar Producto
					        </button>
					
					    </div>
					
					</form>

                </div>
            </div>

        </div>
    </div>

</div>
</body>
</html>
